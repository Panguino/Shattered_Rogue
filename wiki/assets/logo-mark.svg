<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Shattered Slop emblem">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4756"/>
      <stop offset="1" stop-color="#151b24"/>
    </linearGradient>
    <linearGradient id="slop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14d2ff"/>
      <stop offset="1" stop-color="#0a7fa3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- hull hexagon, split into shards by two cracks -->
  <g stroke="#6fdff9" stroke-width="2.4" stroke-linejoin="round" fill="url(#steel)">
    <!-- left-top shard -->
    <path d="M60 8 L20 31 L20 52 L48 44 L56 26 Z"/>
    <!-- right-top shard, nudged outward -->
    <path d="M60 8 L100 31 L100 50 L66 40 L58 24 Z" transform="translate(3 -2)"/>
    <!-- left-bottom shard -->
    <path d="M20 58 L46 50 L54 70 L44 96 L20 82 Z" transform="translate(-2 2)"/>
    <!-- right-bottom shard -->
    <path d="M100 56 L68 46 L58 68 L70 100 L100 82 Z" transform="translate(2 3)"/>
  </g>
  <!-- slop core leaking through the fracture -->
  <g filter="url(#glow)">
    <path fill="url(#slop)" d="M56 28 C60 34 64 36 66 42 C63 50 58 52 56 58 C60 66 66 70 64 80 C60 86 56 88 56 96 C56 102 60 104 60 110 C60 114 57 114 55 111 C52 106 54 100 51 96 C46 88 50 80 48 72 C44 64 50 58 52 52 C48 46 50 38 56 28 Z"/>
    <circle cx="60" cy="112" r="2.6" fill="#14d2ff"/>
  </g>
  <!-- gold reticle tick, the player's mark -->
  <g stroke="#ffc63d" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M12 60 h8"/><path d="M100 60 h8"/>
  </g>
</svg>
